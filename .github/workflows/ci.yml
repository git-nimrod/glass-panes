name: CI

# The checks that run on every push to this repository. The full automated test suite runs before each release, in the maintainers' own
# environment (see docs/testing.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: Home Assistant checks (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
