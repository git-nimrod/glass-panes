name: Mirror app

# Builds the Android mirror app whenever it changes. The integration has its own workflow (ci.yml).
on:
  push:
    branches: [main]
    paths: ["mirror-app/**", ".github/workflows/mirror-app.yml"]
  pull_request:
    paths: ["mirror-app/**", ".github/workflows/mirror-app.yml"]
  release:
    types: [published]
  workflow_dispatch:          # "Run workflow" button / `gh workflow run`: a dry run of the signed build (nothing is published)

jobs:
  build:
    name: Build the debug APK
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirror-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Android platform the app is built against (the runner already has the SDK)
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Check the wrapper is Gradle's own
        run: |
          # published at https://gradle.org/release-checksums/ (Gradle 8.9)
          echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Keep the APK for two weeks (a debug build, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: mirror-kiosk-debug
          path: mirror-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release-apk:
    # The mirror app has its OWN releases, separate from the Home Assistant integration: a release whose tag starts with "app-v"
    # (app-v0.10.5 and so on) builds the app signed with the project's release key and attaches it to that release. Integration
    # releases (v0.10.N, which HACS installs) and the Android image releases do NOT build or carry an app. Needs the four secrets
    # kept as repository secrets.
    name: Build the signed release APK
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to attach the APK to the release
    defaults:
      run:
        working-directory: mirror-app
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app's own version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          WANT="${TAG#app-v}"
          HAVE=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          test "$WANT" = "$HAVE" || { echo "The tag says $WANT but mirror-app/app/build.gradle.kts says $HAVE. Make them match (bump versionName and versionCode) and release again."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Android platform the app is built against (the runner already has the SDK)
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Check the wrapper is Gradle's own
        run: |
          echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Restore the release key from the secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The KEYSTORE_BASE64 secret is not set (add it under Settings > Secrets and variables > Actions)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: chmod +x gradlew
      - name: Build the signed release APK
        env:
          GP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          GP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Show who signed it (the certificate fingerprint is public)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Dry run only - keep the signed APK for three days (not published)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mirror-kiosk-signed-dry-run
          path: mirror-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          NAME="mirror-kiosk-v${TAG#app-v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release upload "$TAG" "$NAME" --repo "${{ github.repository }}" --clobber
